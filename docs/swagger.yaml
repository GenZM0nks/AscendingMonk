basePath: /
definitions:
  handlers.AuthResponse:
    properties:
      message:
        type: string
      statusCode:
        type: integer
    type: object
  handlers.ErrorWithMessageAndStatusCode:
    properties:
      message:
        type: string
      statusCode:
        type: integer
    type: object
  handlers.HTTPValidationError:
    properties:
      detail:
        items:
          $ref: '#/definitions/handlers.ValidationError'
        type: array
    type: object
  handlers.SearchResult:
    properties:
      description:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  handlers.SearchResultDataWrapper:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.SearchResult'
        type: array
    type: object
  handlers.StandardResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.WeatherData'
    type: object
  handlers.ValidationError:
    properties:
      loc:
        items: {}
        type: array
      msg:
        type: string
      type:
        type: string
    type: object
  handlers.WeatherData:
    properties:
      days:
        items:
          $ref: '#/definitions/handlers.WeatherDay'
        type: array
      location:
        type: string
    type: object
  handlers.WeatherDay:
    properties:
      date:
        type: string
      precipitationProbability:
        type: integer
      temperatureMaximum:
        type: number
      temperatureMinimum:
        type: number
      weatherCode:
        type: integer
      windDirectionDominant:
        type: integer
      windSpeedMaximum:
        type: number
    type: object
host: 20.251.205.81:8080
info:
  contact:
    email: apisupport@genzmonks.com
    name: API Support
    url: https://github.com/GenZM0nks/AscendingMonk
  description: This is a Go rewrite of whoknows.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AscendingMonkAPI
  version: "1.0"
paths:
  /:
    get:
      description: Render the search template to show in the browser.
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "500":
          description: error
          schema:
            type: string
      summary: Show search.html
      tags:
      - Pages
  /about:
    get:
      description: Render the about template to show in the browser.
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "500":
          description: error
          schema:
            type: string
      summary: Show about.html
      tags:
      - Pages
  /api/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Login to an existing user account
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.HTTPValidationError'
      summary: Login a user
      tags:
      - API
  /api/logout:
    get:
      description: Log users out and delete their session data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Log users out.
      tags:
      - API
  /api/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Register a new user account
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Password confirmation
        in: formData
        name: password2
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.HTTPValidationError'
      summary: Register a new user
      tags:
      - API
  /api/search:
    get:
      description: Fetch query data from the database.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Two-letter language string like 'en' for English, the default
          option.
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: A collection of search results relevant to the query
          schema:
            $ref: '#/definitions/handlers.SearchResultDataWrapper'
        "422":
          description: Unprocessable Content - missing query parameter 'q'
          schema:
            $ref: '#/definitions/handlers.ErrorWithMessageAndStatusCode'
        "500":
          description: Internal Server Error - either database failure or JSON marshalling
          schema:
            $ref: '#/definitions/handlers.ErrorWithMessageAndStatusCode'
      summary: Fetch query data.
      tags:
      - API
  /api/weather:
    get:
      description: Fetch a seven-day weather forecast for Copenhagen.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.StandardResponse'
        "500":
          description: error
          schema:
            type: string
      summary: Fetch weather forecast.
      tags:
      - API
      - API
  /login:
    get:
      description: Render the Login template to show in the browser.
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "500":
          description: error
          schema:
            type: string
      summary: Show login.html
      tags:
      - Pages
    post:
      description: Accepts a username and password, and compares them to the sqlite
        database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "422":
          description: error
          schema:
            type: string
      summary: Show login.html
      tags:
      - queries
  /register:
    get:
      description: Render the Register template to show in the browser.
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "500":
          description: error
          schema:
            type: string
      summary: Show register.html
      tags:
      - Pages
  /weather:
    get:
      description: Render the Weather template with a seven-day weather forecast for
        Copenhagen.
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "500":
          description: Failed to fetch weather forecast
          schema:
            type: string
      summary: Show weather.html
      tags:
      - Pages
swagger: "2.0"
