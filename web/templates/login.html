{{ define "title" }}Login{{ end }}

{{ define "body" }}
  <h2>Log In</h2>

  {{ if .Errors }}
  <div class="error">
    <ul>
      {{ range .Errors}}
      <li>{{ .Message }}</li>
      {{ end }}
    </ul>
  </div>
  {{ end }}

  <form action="/login" method="POST">
    <dl>
      <dt>Username:
      <dd><input type="text" name="username" size="30" value="{{ .Username }}">
      <dt>Password:
      <dd><input type="password" name="password" size="30">
    </dl>
    <div class="actions">
      <button type="submit" id="login-button">Log in</button>
    </div>
  </form>
{{ end }}
