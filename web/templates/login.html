{{ define "title" }}Login{{ end }}

{{ define "body" }}
  <h2>Log In</h2>

  {{ if .Errors }}
  <ul>
    {{ range .Errors}}
    <li>{{ .message }}</li>
    {{ end }}
  </ul>
  {{ end }}

  <form action="/api/login" method="POST">
    <dl>
      <dt>Username:
      <dd><input type="text" name="username" size="30" value="{{ .Username }}">
      <dt>Password:
      <dd><input type="password" name="password" size="30">
    </dl>
    <div class="actions">
      <input type="submit" id="login-button" value="Log In">
    </div>
  </form>
{{ end }}
