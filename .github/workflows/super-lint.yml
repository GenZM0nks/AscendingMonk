# Adapted from https://github.com/super-linter/super-linter
name: Super-Linter

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint (Super-Linter)
    runs-on: ubuntu-latest

    permissions:
      # To lint
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments.
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks.
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false
    
      - name: Load Super-Linter configuration
        run: cat .github/super-linter.env >> "$GITHUB_ENV"

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}