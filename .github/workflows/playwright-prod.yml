name: Production Playwright smoke tests

on:
  workflow_run:
    workflows: ["Deploy to Azure"]
    types: [completed]

jobs:
  smoke:
    if: >- # This operator folds any following lines into one.
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install playwright prerequisites
        run: |
          npm ci
          npx playwright install --with-deps
      
      - name: Run Playwright
        run: npx playwright test
        env:
          BASE_URL: https://ascendingmonk.dk
          TEST_USERNAME: ${{ secrets.PRODUCTION_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_PASSWORD }}

  rollback:
    needs: [smoke]
    # failure() in the below is necessary because GH skips dependent jobs on
    # parent job failures. It implicitly has a hidden success() in the 
    # if-block if we don't specify otherwise. 
    # success() would be false if smoke failed, which would skip rollback.
    if: ${{ failure() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollback on Playwright failure(s)
        env:
          AZURE_SSH_HOST: ${{ secrets.AZURE_SSH_HOST }}
          AZURE_SSH_HOST_KEY: ${{ secrets.AZURE_SSH_HOST_KEY }}
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p "$HOME/.ssh"

          trap 'rm -f "$HOME/.ssh/ascendingmonk_deploy"' EXIT

          printf '%s\n' "$AZURE_SSH_PRIVATE_KEY" > "$HOME/.ssh/ascendingmonk_deploy"
          printf '%s %s\n' "$AZURE_SSH_HOST" "$AZURE_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/ascendingmonk_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "monkdeploy@$AZURE_SSH_HOST" \
            "sudo -n /opt/ascendingmonk-deploy/rollback.sh previous"