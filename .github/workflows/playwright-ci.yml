name: CI Playwright smoke tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: http://127.0.0.1:8081
      TEST_USERNAME: ci-smoke-user
      TEST_EMAIL: ci-smoke-user@example.invalid
      TEST_PASSWORD: aA!4bH_j

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.0

      - name: Create fake database
        id: fake-database
        run: |
          DB_DIR="$(mktemp -d)"
          echo "db_dir=$DB_DIR" >> "$GITHUB_OUTPUT"
          sqlite3 "$DB_DIR/test.db" < schema.sql
          sqlite3 "$DB_DIR/test.db" "INSERT INTO pages(title, url, language, last_updated, content) VALUES ('Fortran', 'fakelink.com', 'en', '19-11-2026 12:00:00.000000000+00:00', 'Fortran...');"
          sudo chown -R 10001:10001 "$DB_DIR"

      - name: Start application
        env:
          DB_HOST_DIR: ${{ steps.fake-database.outputs.db_dir }}
          DB_PATH: /data/test.db
        run: docker compose -f compose.dev.yaml up -d

      - name: Register fake user
        run: |
          ready=false
          for i in {1..30}; do
            if curl --silent --fail "$BASE_URL/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Application did not become ready"
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
          --retry 5 \
          --retry-delay 1 \
          --retry-max-time 30 \
          --request POST "$BASE_URL/api/register" \
          --data-urlencode "username=$TEST_USERNAME" \
          --data-urlencode "email=$TEST_EMAIL" \
          --data-urlencode "password=$TEST_PASSWORD"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: config/playwright/package-lock.json

      - name: Install Playwright
        working-directory: config/playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Expose dependencies to tests
        run: ln -s config/playwright/node_modules node_modules

      - name: Run Playwright
        run: npx --no-install playwright test --config=config/playwright/playwright.ci.config.ts

      - name: Clean up
        if: always()
        env:
          DB_DIR: ${{ steps.fake-database.outputs.db_dir }}
        run: |
          docker compose -f compose.dev.yaml down --volumes --remove-orphans || true
          if [ -n "$DB_DIR" ]; then sudo rm -rf -- "$DB_DIR"; fi