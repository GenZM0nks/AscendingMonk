# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI / Continuous Delivery / Continuous Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build application
        run: go build -v ./cmd/main

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run all tests
        run: go test -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Revive
        uses: docker://morphy/revive-action:v2

  delivery:
    name: Publish Docker image
    runs-on: ubuntu-latest

    needs: [build, test, lint]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Go image metadata
        id: meta_go
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/genzm0nks/ascendingmonk
          bake-target: ascendingmonk
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Generate Nginx image metadata
        id: meta_nginx
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/genzm0nks/ascendingmonk-nginx
          bake-target: nginx
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push Docker images
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta_go.outputs.bake-file-tags }}
            cwd://${{ steps.meta_go.outputs.bake-file-annotations }}
            cwd://${{ steps.meta_nginx.outputs.bake-file-tags }}
            cwd://${{ steps.meta_nginx.outputs.bake-file-annotations }}
          targets: ascendingmonk,nginx
          push: true
