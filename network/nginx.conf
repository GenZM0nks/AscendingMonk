load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

events { }

http {
    js_import logger from /etc/nginx/logger.js;
    js_var $response_body "";
    js_var $response_truncated "false";
    js_var $response_capture_error "false";

    js_set $response_body_text logger.responseText;

    # Existing search logging that will continue our existing logging method
    log_format searches '$time_iso8601\t$uri\t$arg_q\t$status';

    map $arg_q $log_search {
        ""      0;
        default 1;
    }

    # Exclude static resources from interaction logging
    map $uri $log_interaction {
        ~^/(static|assets)/ 0;
        ~*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|webp)$ 0;
        default 1;
    }

    # Structured interaction logging
    log_format interactions escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"timestamp_unix":$msec,'
            '"ip":"$remote_addr",'
            '"request_id":"$request_id",'
            '"connection":"$connection",'
            '"connection_requests":$connection_requests,'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"request_uri":"$request_uri",'
            '"query":"$arg_q",'
            '"language":"$arg_language",'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer",'
            '"status":$status,'
            '"content_type":"$sent_http_content_type",'
            '"request_size":$request_length,'
            '"response_size":$body_bytes_sent,'
            '"response_time":$request_time,'
            '"response_body":"$response_body_text",'
            '"response_truncated":$response_truncated,'
            '"response_capture_error":$response_capture_error'
        '}';

    server {
        listen 80;
        server_name ascendingmonk.dk www.ascendingmonk.dk;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ascendingmonk.dk www.ascendingmonk.dk;

        ssl_certificate /etc/letsencrypt/live/ascendingmonk.dk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ascendingmonk.dk/privkey.pem;

        access_log /var/log/nginx/interactions.jsonl interactions if=$log_interaction;

        location = / {
            access_log /var/log/nginx/searches.log searches if=$log_search;
            access_log /var/log/nginx/interactions.jsonl interactions if=$log_interaction;

            js_body_filter logger.captureResponse buffer_type=buffer;

            proxy_pass http://ascendingmonk:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
        }

        location ~ ^/(search|api/search)$ {
            access_log /var/log/nginx/searches.log searches if=$log_search;
            access_log /var/log/nginx/interactions.jsonl interactions if=$log_interaction;

            js_body_filter logger.captureResponse buffer_type=buffer;

            proxy_pass http://ascendingmonk:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
        }

        location / {
            proxy_pass http://ascendingmonk:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
