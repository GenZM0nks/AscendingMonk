services:
  ascendingmonk:
    image: ghcr.io/genzm0nks/ascendingmonk:sha-${IMAGE_SHA:?IMAGE_SHA must be set}
    user: "995:994"
    environment:
      DB_PATH: /data/ascendingmonk_with_orig.db
      COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /var/lib/ascendingmonk
        target: /data
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: ghcr.io/genzm0nks/ascendingmonk-nginx:sha-${IMAGE_SHA:?IMAGE_SHA must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/live/ascendingmonk.dk:/etc/letsencrypt/live/ascendingmonk.dk:ro
      - /etc/letsencrypt/archive/ascendingmonk.dk:/etc/letsencrypt/archive/ascendingmonk.dk:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - ascendingmonk
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
