{{define "layout"}}
<!doctype html>
<title>¿Who Knows?{{if .PageTitle}} - {{ .PageTitle }}{{end}}</title>
<link rel="stylesheet" type="text/css" href="../style.css">
<div class="page">
  <div class="navigation">
  <nav>
    <h1><a id="nav-logo" href="http://localhost:8080/about">¿Who Knows?</a></h1>
    {{if .User}}
    <a id="nav-logout" href="http://localhost:8080/logout">Log out</a>
    {{else}}
    <a id="nav-login" href="http://localhost:8080/login">Log in</a>
    <a id="nav-register" href="http://localhost:8080/register">Register</a>
    {{end}}
  </nav>
  </div>
  {{if .Flashes}}
    <ul class="flashes">
    {{range .Flashes}}
      <li>{{ . }}
    {{end}}
    </ul>
  {{end}}
  <div class="body">
  {{template "content" .}}
  </div>
  <div class="footer">
    <span>¿Who Knows? &copy; 2009</span>
    <a href="http://localhost:8080/about">About</a>
  </div>
</div>
{{end}}
